</head><body>
<style id="css">
/* Layout: mapa 2D a pantalla completa (estilo Mapas de iPhone) con un panel deslizable abajo; en pantallas anchas el panel flota a la izquierda */
:root{
  --bg:#f2f2f7;--card:#ffffff;--fill:rgba(118,118,128,.12);--sep:rgba(60,60,67,.18);
  --label:#000000;--label2:rgba(60,60,67,.62);--label3:rgba(60,60,67,.32);
  --blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--gray:#8e8e93;
  --glass:rgba(249,249,251,.82);--glass-line:rgba(0,0,0,.08);
  --land:#f4f1ea;--grass:#d6ebc9;--pitch:#bfe2ad;--pitch-line:rgba(255,255,255,.85);--tree:#a9d499;--tree-dark:#93c483;
  --bld:#e4e1db;--bld-top:#eeebe6;--bld-shadow:rgba(80,70,50,.18);--bld-line:#d3cfc7;--sand:#efe2c4;
  --road:#ffffff;--road-edge:#dcd7cd;--map-label:#3a3a3c;--map-label-halo:rgba(255,255,255,.9);
  --sh:rgba(70,60,40,.2);--tree-s:rgba(60,80,40,.18);--tree-h:rgba(255,255,255,.28);--grass-dot:rgba(90,140,70,.18);--walk:#e9e3d6;--road-mid:#e8e2d6;
  --aero-roof:#dfe5fa;--aero-wall:#b4c1ea;--aero-line:#8f9fd6;--aero:#3d5bd9;
  --anexo-roof:#fde6cf;--anexo-wall:#efc193;--anexo-line:#d99c62;--anexo:#d9741f;
  --ciclo-roof:#d3f0ea;--ciclo-wall:#9ed6ca;--ciclo-line:#62b4a2;--ciclo:#16917a;
  --plaque:#ffffff;--plaque-line:rgba(0,0,0,.1);
  --shadow:0 8px 28px rgba(0,0,0,.14);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,"Segoe UI",Roboto,sans-serif;
  --f-round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000;--card:#1c1c1e;--fill:rgba(118,118,128,.24);--sep:rgba(84,84,88,.6);
  --label:#ffffff;--label2:rgba(235,235,245,.62);--label3:rgba(235,235,245,.3);
  --blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;--gray:#8e8e93;
  --glass:rgba(30,30,32,.8);--glass-line:rgba(255,255,255,.08);
  --land:#1d1f22;--grass:#20302a;--pitch:#27412f;--pitch-line:rgba(255,255,255,.35);--tree:#2b4633;--tree-dark:#24402c;
  --bld:#3a3b40;--bld-top:#45464c;--bld-shadow:rgba(0,0,0,.45);--bld-line:#2c2d31;--sand:#3d372c;
  --road:#4b4c52;--road-edge:#2a2b2f;--map-label:#e5e5ea;--map-label-halo:rgba(0,0,0,.75);
  --sh:rgba(0,0,0,.45);--tree-s:rgba(0,0,0,.3);--tree-h:rgba(255,255,255,.07);--grass-dot:rgba(140,200,120,.1);--walk:#3a3a3e;--road-mid:#5d5e64;
  --aero-roof:#3a4370;--aero-wall:#283057;--aero-line:#55609a;--aero:#7d95ff;
  --anexo-roof:#5e4630;--anexo-wall:#43311f;--anexo-line:#8a6640;--anexo:#ffa04d;
  --ciclo-roof:#2c5a52;--ciclo-wall:#1d3f39;--ciclo-line:#3f8576;--ciclo:#4fd1b6;
  --plaque:#2c2c2e;--plaque-line:rgba(255,255,255,.12);
  --shadow:0 8px 28px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000;--card:#1c1c1e;--fill:rgba(118,118,128,.24);--sep:rgba(84,84,88,.6);
  --label:#ffffff;--label2:rgba(235,235,245,.62);--label3:rgba(235,235,245,.3);
  --blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;--gray:#8e8e93;
  --glass:rgba(30,30,32,.8);--glass-line:rgba(255,255,255,.08);
  --land:#1d1f22;--grass:#20302a;--pitch:#27412f;--pitch-line:rgba(255,255,255,.35);--tree:#2b4633;--tree-dark:#24402c;
  --bld:#3a3b40;--bld-top:#45464c;--bld-shadow:rgba(0,0,0,.45);--bld-line:#2c2d31;--sand:#3d372c;
  --road:#4b4c52;--road-edge:#2a2b2f;--map-label:#e5e5ea;--map-label-halo:rgba(0,0,0,.75);
  --sh:rgba(0,0,0,.45);--tree-s:rgba(0,0,0,.3);--tree-h:rgba(255,255,255,.07);--grass-dot:rgba(140,200,120,.1);--walk:#3a3a3e;--road-mid:#5d5e64;
  --aero-roof:#3a4370;--aero-wall:#283057;--aero-line:#55609a;--aero:#7d95ff;
  --anexo-roof:#5e4630;--anexo-wall:#43311f;--anexo-line:#8a6640;--anexo:#ffa04d;
  --ciclo-roof:#2c5a52;--ciclo-wall:#1d3f39;--ciclo-line:#3f8576;--ciclo:#4fd1b6;
  --plaque:#2c2c2e;--plaque-line:rgba(255,255,255,.12);
  --shadow:0 8px 28px rgba(0,0,0,.5);color-scheme:dark}
html,body{height:100%;overflow:hidden;background:var(--land);color:var(--label)}
body{font-family:var(--f);font-size:17px;line-height:1.3;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.glass{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border:.5px solid var(--glass-line)}

/* mapa */
.map{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overflow:hidden;overflow:clip;background:var(--land)}
.map svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.m-land{fill:var(--land)}.m-grass{fill:var(--grass)}.m-pitch{fill:var(--pitch)}
.m-lines{fill:none;stroke:var(--pitch-line);stroke-width:1.6}
.m-tree{fill:var(--tree)}.m-tree2{fill:var(--tree-dark)}
.m-bld-s{fill:var(--bld-shadow)}.m-bld{fill:var(--bld);stroke:var(--bld-line);stroke-width:1}.m-ridge{stroke:var(--bld-line);stroke-width:1;fill:none}
.m-sand{fill:var(--sand)}
.m-sh{fill:var(--sh)}
.m-zone{fill:rgba(255,204,0,.42);stroke:#e6a700;stroke-width:2;stroke-linejoin:round}
.m-zone.draft{stroke-dasharray:6 4}
.lbl.zone{background:#ffcc00;color:#1c1c1e;text-shadow:none;font-size:14px;font-weight:700;padding:4px 10px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.18);white-space:normal;max-width:180px;text-align:center;line-height:1.15}
.lbl.zone.edit{pointer-events:auto;cursor:pointer;outline:2px dashed rgba(0,0,0,.35);outline-offset:2px}
.m-tree-s{fill:var(--tree-s)}.m-tree-h{fill:var(--tree-h)}.m-grass-dot{fill:var(--grass-dot)}
.m-walk{fill:var(--walk)}
.m-road-mid{fill:none;stroke:var(--road-mid);stroke-width:1.4;stroke-dasharray:8 9}
.b-aeronautica .m-roof{fill:var(--aero-roof);stroke:var(--aero-line)}.b-aeronautica .m-wall{fill:var(--aero-wall)}.b-aeronautica line{stroke:var(--aero-line)}
.b-anexo .m-roof{fill:var(--anexo-roof);stroke:var(--anexo-line)}.b-anexo .m-wall{fill:var(--anexo-wall)}.b-anexo line{stroke:var(--anexo-line)}
.b-ciclo .m-roof{fill:var(--ciclo-roof);stroke:var(--ciclo-line)}.b-ciclo .m-wall{fill:var(--ciclo-wall)}.b-ciclo line{stroke:var(--ciclo-line)}
.m-roof{stroke-width:1.2;stroke-linejoin:round}
.m-seam{stroke-width:1.4}.m-ridge{stroke-width:.9;stroke-dasharray:3 3;opacity:.8}
.lbl.plaque{pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:7px;background:var(--plaque);color:var(--label);text-shadow:none;font-size:16px;font-weight:700;padding:7px 12px 7px 9px;border-radius:999px;border:.5px solid var(--plaque-line);box-shadow:0 3px 12px rgba(0,0,0,.16);letter-spacing:-.01em}
.lbl.plaque::after{content:"";position:absolute;width:0;height:0;border:6px solid transparent}
.lbl.plaque.p-top::after{left:50%;margin-left:-6px;bottom:-6px;border-bottom:0;border-top-color:var(--plaque)}
.lbl.plaque.p-bottom::after{left:50%;margin-left:-6px;top:-6px;border-top:0;border-bottom-color:var(--plaque)}
.lbl.plaque.p-left::after{top:50%;margin-top:-6px;right:-6px;border-right:0;border-left-color:var(--plaque)}
.lbl.plaque.p-right::after{top:50%;margin-top:-6px;left:-6px;border-left:0;border-right-color:var(--plaque)}
.m-zone.edit{cursor:pointer}
.zone-sw{flex:none;width:30px;height:22px;border-radius:5px;background:rgba(255,204,0,.42);border:2px solid #e6a700}
.lbl.plaque i{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 0 0 .5px rgba(0,0,0,.15)}
.dot-aero{background:var(--aero)}.dot-anexo{background:var(--anexo)}.dot-ciclo{background:var(--ciclo)}
.help{padding:4px 0}
.help-row{display:flex;gap:12px;align-items:flex-start;padding:10px 14px;font-size:16px;line-height:1.35}
.help-row + .help-row{border-top:.5px solid var(--sep)}
.help-ic{flex:none;width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;font-weight:700;font-family:var(--f-round);display:flex;align-items:center;justify-content:center;font-size:15px}
.help-ic svg{width:16px;height:16px}
.help-ic.b{background:var(--blue)}.help-ic.g{background:var(--green)}.help-ic.o{background:var(--orange)}
.ctrl-aa{font-weight:700;font-size:18px;font-family:var(--f)}
html.big .sheet-body,html.big .modal-card,html.big .toast{zoom:1.2}
html.big .lbl{font-size:16px}
html.big .lbl.plaque{font-size:19px;padding:8px 14px 8px 10px}
html.big .lbl.plaque i{width:16px;height:16px}
.m-road-edge{fill:none;stroke:var(--road-edge);stroke-width:21;stroke-linecap:round;stroke-linejoin:round}
.m-road{fill:none;stroke:var(--road);stroke-width:17;stroke-linecap:round;stroke-linejoin:round}
.overlay{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;font-weight:600;font-size:13px;color:var(--map-label);text-shadow:0 0 3px var(--map-label-halo),0 0 3px var(--map-label-halo),0 0 6px var(--map-label-halo);letter-spacing:-.01em}
.lbl.sector{font-size:15px;font-weight:700;text-align:center;line-height:1.1}
.lbl.pem{text-align:center;line-height:1.1}
.lbl.sector small{display:block;font-size:11px;font-weight:600;color:var(--label2);text-align:center}
.lbl.soft{font-weight:600;color:var(--label2);font-size:15px;font-style:italic}
.lbl.road{font-size:13px;font-weight:600;color:var(--label2);letter-spacing:.04em}
.pin{position:absolute;left:0;top:0;pointer-events:auto;border:0;background:none;padding:0;width:48px;height:58px;margin:-56px 0 0 -24px;display:flex;justify-content:center}
.pin .dot{width:40px;height:40px;border-radius:50%;background:var(--red);color:#fff;font-family:var(--f-round);font-weight:700;font-size:19px;display:flex;align-items:center;justify-content:center;border:2.5px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.28);position:relative;transition:transform .18s ease}
.pin .dot::after{content:"";position:absolute;bottom:-9px;left:50%;margin-left:-5px;border:5px solid transparent;border-top:6px solid #fff}
.pin.live .dot{background:var(--green)}
.pin.done .dot{background:var(--gray)}
.pin.live .dot::before{content:"";position:absolute;inset:-7px;border-radius:50%;border:3px solid var(--green);animation:pulse 1.8s ease-out infinite}
.pin.sel{z-index:3}.pin.sel .dot{transform:scale(1.28) translateY(-4px)}
.pin.dim{opacity:.3}
@keyframes pulse{from{opacity:.8;transform:scale(.85)}to{opacity:0;transform:scale(1.45)}}
@media (prefers-reduced-motion:reduce){.pin.live .dot::before{animation:none;opacity:.5}.pin .dot,.sheet{transition:none!important}}

/* controles flotantes */
.ctrls{position:fixed;z-index:20;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.ctrl{width:46px;height:46px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--blue)}
.ctrl + .ctrl{border-top:.5px solid var(--sep)}
.ctrl svg{width:22px;height:22px}
.ctrl[aria-pressed="true"]{color:var(--orange)}
.compass{transition:transform .2s}
.placing-bar{position:fixed;z-index:25;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;padding:10px 10px 10px 16px;border-radius:14px;box-shadow:var(--shadow);font-size:15px;font-weight:600;max-width:calc(100vw - 90px)}
.placing-bar span{min-width:0}

/* panel */
.sheet{position:fixed;z-index:30;left:0;right:0;bottom:0;height:calc(100% - 52px - env(safe-area-inset-top,0px));border-radius:14px 14px 0 0;box-shadow:0 -4px 30px rgba(0,0,0,.16);display:flex;flex-direction:column;transition:transform .32s cubic-bezier(.2,.8,.2,1);will-change:transform}
.sheet.dragging{transition:none}
.grab{flex:none;height:34px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;border:0;background:transparent;width:100%}
.sheet .head{touch-action:none;cursor:grab}
.grab::before{content:"";width:38px;height:5px;border-radius:3px;background:var(--label3)}
.sheet-body{flex:1;overflow:auto;overscroll-behavior:contain;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));-webkit-overflow-scrolling:touch}
@media (min-width:900px){
  .sheet{left:max(16px,env(safe-area-inset-left,0px));right:auto;top:calc(16px + env(safe-area-inset-top,0px));bottom:16px;width:390px;height:auto;border-radius:16px;transform:none!important;box-shadow:var(--shadow)}
  .grab{display:none}
  .sheet .head{touch-action:auto;cursor:auto}
  .sheet-body{padding-top:16px}
}
.head{display:flex;align-items:center;gap:12px;margin:2px 0 12px}
.head img{height:34px;width:auto;flex:none}
.head h1{font-size:30px;font-weight:800;letter-spacing:.01em;margin:0;line-height:1.05}
.head p{margin:2px 0 0;color:var(--label2);font-size:14px}
.head > div{min-width:0;flex:1}
.search{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;padding:0 10px;height:38px;margin-bottom:10px}
.search svg{width:17px;height:17px;flex:none;color:var(--label2)}
.search input{border:0;background:transparent;outline:none;flex:1;min-width:0;font-size:17px;height:100%}
.search input::placeholder{color:var(--label2)}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px;margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:0;background:transparent;border-radius:7px;padding:8px 10px;font-size:14px;font-weight:600;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.sec-t{font-size:14px;text-transform:uppercase;color:var(--label2);margin:0 0 6px 16px;letter-spacing:.02em}
.sec-t.big{font-size:20px;text-transform:none;color:var(--label);font-weight:700;margin:0 0 8px 2px;letter-spacing:0}
.group{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:22px}
.row{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;text-align:left;padding:10px 14px;min-height:56px;position:relative}
.row + .row::before{content:"";position:absolute;top:0;left:60px;right:0;border-top:.5px solid var(--sep)}
.row:active{background:var(--fill)}
.num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;font-family:var(--f-round);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center}
.num.live{background:var(--green)}.num.done{background:var(--gray)}
.row-main{flex:1;min-width:0}
.row-t{font-size:18px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-s{font-size:15px;color:var(--label2);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-s b{font-weight:600}
.row-s .g{color:var(--green)}.row-s .b{color:var(--red)}
.row-r{flex:none;color:var(--label2);font-size:15px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.chev{width:8px;height:13px;color:var(--label3)}
.empty{background:var(--card);border-radius:12px;padding:18px 16px;margin-bottom:22px}
.empty strong{display:block;font-size:17px;margin-bottom:4px}
.empty p{margin:0;color:var(--label2);font-size:15px}

/* detalle */
.nav{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px -6px}
.back{border:0;background:transparent;color:var(--blue);font-size:17px;display:flex;align-items:center;gap:2px;padding:6px}
.back svg{width:12px;height:20px}
.link{border:0;background:transparent;color:var(--blue);font-size:17px;padding:6px}
.d-head{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.d-head .num{width:52px;height:52px;font-size:24px}
.d-head h2{font-size:26px;font-weight:700;margin:0;line-height:1.12;overflow-wrap:anywhere}
.d-head p{margin:3px 0 0;color:var(--label2);font-size:15px}
.d-head > div{min-width:0}
.status{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);border-radius:12px;margin-bottom:22px}
.status .ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none;background:var(--red)}
.status .ic svg{width:20px;height:20px}
.status.live .ic{background:var(--green)}.status.done .ic,.status.none .ic{background:var(--gray)}
.status b{display:block;font-size:17px}.status span{color:var(--label2);font-size:14px}
.times{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px}
.time{font-family:var(--f-round);font-weight:600;font-size:17px;padding:6px 12px;border-radius:999px;background:var(--fill);font-variant-numeric:tabular-nums}
.time.past{color:var(--label3);text-decoration:line-through}
.time.live{background:var(--green);color:#fff}
.time.next{background:var(--red);color:#fff}
.para{padding:12px 16px;margin:0;white-space:pre-wrap;font-size:17px;line-height:1.4}

/* admin */
.admin{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:18px;border:1.5px solid var(--orange)}
.admin p{margin:0 0 10px;font-size:15px;color:var(--label2)}
.admin p b{color:var(--orange)}
.admin-btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:0;border-radius:10px;padding:9px 14px;font-size:15px;font-weight:600;background:var(--fill);color:var(--blue)}
.btn.fill{background:var(--blue);color:#fff}
.btn.danger{color:var(--red)}
.btn.danger.armed{background:var(--red);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.draft{margin-top:10px;padding-top:10px;border-top:.5px solid var(--sep);font-size:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* modal estilo hoja */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;padding-top:max(24px,env(safe-area-inset-top,0px))}
@media (min-width:640px){.modal{align-items:center;padding:24px}}

    if ($('f-move')) $('f-move').onclick = function(){ closeModal(); startPlacing({mode:'move', id:p.id}); };
    if ($('f-del')) $('f-del').onclick = function(){
      if (!this.classList.contains('armed')){ this.classList.add('armed'); this.textContent = '¿Seguro? Tocá de nuevo'; return; }
      DATA.proyectos.splice(DATA.proyectos.indexOf(p), 1);
      S.sel = null; changed(); closeModal(); render(); toast('Proyecto eliminado');
    };
    $('f-proj').onsubmit = function(e){
      e.preventDefault();
      var nombre = $('f-nombre').value.trim(), tt = parseTimes($('f-hor').value);
      if (!nombre){ $('f-err').textContent = 'Poné un nombre al proyecto.'; $('f-nombre').focus(); return; }
      if (tt.bad.length){ $('f-err').textContent = 'No entiendo estos horarios: ' + tt.bad.join(', ') + '. Usá el formato 10:30.'; $('f-hor').focus(); return; }
      var obj = p || {id: uid(), x: P.x, y: P.y};
      obj.nombre = nombre; obj.sector = $('f-sector').value; obj.descripcion = $('f-desc').value.trim();
      obj.horarios = tt.times; obj.duracion = Math.max(1, Math.min(240, parseInt($('f-dur').value, 10) || 15));
      obj.responsables = $('f-resp').value.trim();
      if (isNew) DATA.proyectos.push(obj);
      S.sel = obj.id; changed(); closeModal(); render();
      toast(isNew ? 'Proyecto ' + numOf(obj) + ' agregado' : 'Cambios guardados');
    };
  }
  function openEvent(){
    openModal(
      '<form id="f-ev"><div class="m-nav"><button type="button" class="link l" data-close>Cancelar</button><h2>Datos de la muestra</h2><button class="link r" type="submit">Listo</button></div>' +
      '<div class="form"><div class="fld"><label for="f-evn">Título</label><input id="f-evn" maxlength="30" value="' + esc(DATA.evento.nombre) + '"></div>' +
      '<div class="fld"><label for="f-evf">Subtítulo</label><input id="f-evf" maxlength="80" placeholder="Sábado 15/11 · 9 a 17 h" value="' + esc(DATA.evento.fecha || '') + '"></div></div></form>' +
      '<p class="sec-t" style="margin-top:22px">Copia de seguridad</p>' +
      '<div class="form"><div class="fld col"><label for="f-json">Todos los datos</label><textarea id="f-json" spellcheck="false" style="font-family:ui-monospace,monospace;font-size:12px;min-height:120px"></textarea></div></div>' +
      '<p class="note">Copiá este texto para guardar los proyectos, o pegá uno guardado y tocá Importar.</p><p class="err" id="f-err"></p>' +
      '<div class="admin-btns"><button type="button" class="btn" id="f-copy">Copiar</button><button type="button" class="btn" id="f-imp">Importar</button></div>'
    );
    $('f-json').value = JSON.stringify(DATA, null, 1);
    $('f-ev').onsubmit = function(e){ e.preventDefault(); DATA.evento.nombre = $('f-evn').value.trim() || 'EXPO IMPA'; DATA.evento.fecha = $('f-evf').value.trim(); changed(); closeModal(); render(); };
    $('f-copy').onclick = function(){
      var ta = $('f-json'), fb = function(){ ta.select(); toast('Seleccioné el texto: copialo con el menú'); };
      try { navigator.clipboard.writeText(ta.value).then(function(){ toast('Copiado'); }, fb); } catch (err) { fb(); }
    };
    $('f-imp').onclick = function(){
      try { var d = JSON.parse($('f-json').value); if (!d || !Array.isArray(d.proyectos)) throw 0; d.evento = d.evento || {}; DATA = d; changed(); closeModal(); S.sel = null; render(); toast('Datos importados. Revisalos y publicá.'); }
      catch (err) { $('f-err').textContent = 'Ese texto no es una copia de seguridad válida.'; }
    };
  }

  /* ---------- publicar ---------- */
  function buildHtml(){
    var json = JSON.stringify(DATA).replace(/</g, '\\u003c');
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + RESET + '</style></head><body>' +
      HEAD +
      '<style id="css">' + SRC.css + '</style>\n' +
      '<script type="application/json" id="expo-data">' + json + '<\/script>\n' +
      '<script type="text/plain" id="expo-logo">' + SRC.logo + '<\/script>\n' +
      '<script id="expo-app">' + SRC.app + '<\/script>\n' +
      '</body></html>';
  }
  // Fuera de Claude (GitHub Pages) la página que la contiene define window.EXPO_STORE con save(json) y avisa con window.EXPO_REMOTE(json)
  window.EXPO_REMOTE = function(json){
    if (S.dirty || S.saving || json === PUBLISHED) return;
    try { DATA = normalize(JSON.parse(json)); } catch (e) { return; }
    PUBLISHED = JSON.stringify(DATA);
    if (S.sel && !byId(S.sel)) S.sel = null;
    render(); draw();
  };
  function uploadSteps(url){
    openModal(
      '<form id="f-up"><div class="m-nav"><span></span><h2>Subir a GitHub</h2><button type="submit" class="link r">Listo</button></div>' +
      '<div class="help group" style="margin-top:14px">' +
      '<div class="help-row"><span class="help-ic b">1</span><span>Se descargó el archivo <b>datos.json</b> con todos los proyectos.</span></div>' +
      '<div class="help-row"><span class="help-ic b">2</span><span>Tocá <b>Abrir GitHub</b>, elegí ese archivo y tocá <b>Commit changes</b>.</span></div>' +
      '<div class="help-row"><span class="help-ic g">3</span><span>En uno o dos minutos todos ven los cambios.</span></div></div>' +
      '<div class="admin-btns"><a class="btn fill" href="' + esc(url) + '" target="_blank" rel="noopener" style="text-decoration:none">Abrir GitHub</a></div></form>'
    );
    $('f-up').onsubmit = function(ev){ ev.preventDefault(); closeModal(); };
  }
  function publish(){
    if (!S.dirty || S.saving) return;
    S.saving = true; render();
    var st = window.EXPO_STORE, cl = window.claude, pr;
    if (st) pr = st.save(JSON.stringify(DATA));
    else pr = (cl && cl.use ? cl.use('artifact') : Promise.resolve(null)).then(function(art){ if (!art) throw {code: 'unavailable'}; return art.publish(buildHtml()); });
    pr.then(function(r){
      PUBLISHED = JSON.stringify(DATA);
      S.dirty = false; S.saving = false;
      // Con archivo para subir, el borrador queda guardado hasta que el archivo nuevo esté en línea
      if (r && r.upload){ render(); uploadSteps(r.upload); return; }
      store(DRAFT_KEY, null); render();
      toast('Publicado. Todos ven los cambios.', 3500);
    }, function(err){
      S.saving = false; render();
      var c = err && err.code;
      if (c === 'conflict') toast('Alguien publicó al mismo tiempo. La página se recarga; tus cambios quedan para recuperar.', 6000);
      else if (c === 'not_admin') toast('Esa cuenta de Google no es de administrador. Tus cambios quedan guardados en este dispositivo.', 7000);
      else if (c === 'login') toast('Para publicar tenés que entrar con tu cuenta de Google. Tus cambios quedan guardados.', 7000);
      else if (c === 'denied') toast('La base de datos no aceptó el cambio. Revisá las reglas de Firebase. Tus cambios quedan guardados.', 7000);
      else if (c === 'not_granted' || c === 'not_writer' || c === 'unavailable') toast('No se pudo publicar desde acá. Abrí el mapa con tu cuenta de Claude. Tus cambios quedan guardados en este dispositivo.', 7000);
      else toast('No se pudo publicar. Probá de nuevo; tus cambios siguen guardados.', 6000);
    });
  }
  window.addEventListener('beforeunload', function(e){ if (S.dirty){ e.preventDefault(); e.returnValue = ''; } });

  /* ---------- arranque ---------- */
  var lastWide = wide();
  window.addEventListener('resize', function(){
    var cx = V.x + vw() / 2 / V.s, cy = V.y + vh() / 2 / V.s;
    placeSheet();
    if (wide() !== lastWide){ lastWide = wide(); showAll(false); } else { V.x = cx - vw() / 2 / V.s; V.y = cy - vh() / 2 / V.s; draw(); }
  });
  if (sload(ADMIN_KEY) === '1') S.admin = true;
  render(); placeSheet(); showAll(false);
  setInterval(function(){ if (!S.saving) render(); }, 30000);
})();
</script>

<script>
// En GitHub Pages: Publicar descarga datos.json para subirlo al repositorio, y al abrir se lee el datos.json publicado
(function(){
  var UPLOAD = 'https://github.com/mapaproyectoimpa/mapaproyectoimpa.github.io/upload/main';
  window.EXPO_STORE = {save: function(json){
    var blob = new Blob([JSON.stringify(JSON.parse(json), null, 1) + '\n'], {type: 'application/json'});
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'datos.json';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    return Promise.resolve({upload: UPLOAD});
  }};
  // Contador de escaneos: el QR abre el link con ?qr y cada apertura así suma 1 (no cuenta al administrador)
  var COUNTER = 'https://abacus.jasoncameron.dev', KEY = 'mapaproyectoimpa/qr';
  var isAdmin = false; try { isAdmin = sessionStorage.getItem('expo-impa-admin') === '1'; } catch (e) {}
  if (/[?&]qr(=|&|$)/.test(location.search)){
    if (!isAdmin) fetch(COUNTER + '/hit/' + KEY).catch(function(){});
    try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) {}
  }
  window.EXPO_ON_ADMIN = function(){
    fetch(COUNTER + '/get/' + KEY, {cache: 'no-store'}).then(function(r){ return r.ok ? r.json() : r.status === 404 ? {value: 0} : Promise.reject(); })
      .then(function(d){ var n = +d.value || 0; window.EXPO_SCANS_TEXT = 'QR escaneado: ' + n + (n === 1 ? ' vez' : ' veces'); })
      .catch(function(){ window.EXPO_SCANS_TEXT = 'QR escaneado: no se pudo leer el contador'; })
      .then(function(){ window.EXPO_RERENDER(); });
  };
  if (isAdmin) window.EXPO_ON_ADMIN();
  fetch('datos.json?t=' + Date.now(), {cache: 'no-store'}).then(function(r){ return r.ok ? r.text() : null; })
    .then(function(t){ if (t) window.EXPO_REMOTE(JSON.stringify(JSON.parse(t))); }).catch(function(){});
})();
</script>
